name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Supersede in-flight runs when an agent pushes again to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip while a PR is a draft; always run on pushes to main.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret-scan diff range below can resolve both
          # the PR's base and head SHAs -- a shallow (default) clone wouldn't
          # have the base commit locally.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            HEAD="HEAD"
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -vE '(\.md$|^docs/|^dev-ledger/)' || true)
          if [ -n "$CHANGED" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/dev-ledger changed; skipping build and test steps."
          fi
      # my-things-core is a sibling repo, not on PyPI — pull it from the same owner.
      - name: Install my-things-core
        if: steps.changes.outputs.code_changed == 'true'
        run: pip install "my-things-core @ git+https://github.com/${{ github.repository_owner }}/my-things-core@main"
      - name: Install
        if: steps.changes.outputs.code_changed == 'true'
        run: pip install -e ".[dev]"
      - name: Ruff
        if: steps.changes.outputs.code_changed == 'true'
        run: ruff check src tests
      - name: Tests
        if: steps.changes.outputs.code_changed == 'true'
        run: pytest --cov=mytemplate --cov-report=xml
      - name: Secret scan (added lines vs base)
        if: github.event_name == 'pull_request'
        run: |
          python -m mythings._secrets scan-diff-range \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Secret scan (PR title + body)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json title,body --jq '.title + "\n" + .body' \
            | python -m mythings._secrets scan-text
      # Warn-only for now (continue-on-error) -- see my-things-core's
      # docs/CONVENTIONS.md "Dependency-vulnerability scanning" for why.
      - name: Dependency vulnerability scan (warn-only)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
